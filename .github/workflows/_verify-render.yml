name: (temp) Verifica render com dados reais

on:
  push:
    branches: [ claude/nice-hawking-gz7ryp ]
    paths:
      - ".github/workflows/_verify-render.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build com dados reais das planilhas
        run: python build/build.py --out dist/index.html
      - name: Render headless e checar erros de JS
        run: |
          python3 - <<'PY'
          import io, re
          src = io.open('dist/index.html', encoding='utf-8').read()
          # sem rede pro CDN no teste: stub do Chart.js só pra exercitar o app.js
          stub = """<script>
          window.__ERRS__=[];
          window.addEventListener('error',e=>window.__ERRS__.push('ERROR: '+(e.message||e.error)));
          window.__CH__=[];
          function Chart(el,cfg){this.destroy=function(){};
            window.__CH__.push(((el&&el.id)||'?')+':'+(((cfg.data&&cfg.data.datasets)||[]).length)+'ds');}
          Chart.prototype.destroy=function(){};
          </script>"""
          src = re.sub(r'<script src="https://cdn\.jsdelivr\.net[^"]*"></script>', stub, src, count=1)
          probe = """<script>(function(){
            const out={errors:window.__ERRS__,pages:{},charts:[]};
            ['geral','meta','rel'].forEach(p=>{
              try{ setPage(p);
                const root=document.getElementById('page-'+p);
                out.pages[p]={
                  steps:[...root.querySelectorAll('.funnel .step')].map(s=>
                    ((s.querySelector('.m-label')||{}).textContent)+'='+(((s.querySelector('.m-val')||{}).textContent)||'').trim()),
                  kpis:[...root.querySelectorAll('.kpi')].map(k=>
                    ((k.querySelector('.kl span')||{}).textContent)+': '+((k.querySelector('.kv')||{}).textContent)),
                  tables:[...root.querySelectorAll('table.dt[id]')].map(t=>
                    t.id+':'+t.querySelectorAll('thead th').length+'c/'+t.querySelectorAll('tbody tr').length+'l')};
              }catch(e){ out.errors.push('PAGE '+p+': '+((e&&e.stack)||e)); }});
            out.charts=window.__CH__;
            const d=document.createElement('div'); d.id='__probe__';
            d.textContent=JSON.stringify(out); document.body.appendChild(d);})();</script>"""
          io.open('dist/test.html','w',encoding='utf-8').write(src.replace('</body>', probe+'</body>'))
          print("test.html pronto")
          PY
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 \
            --dump-dom "file://$PWD/dist/test.html" > dom.html 2>/dev/null || \
          chromium --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 \
            --dump-dom "file://$PWD/dist/test.html" > dom.html
          python3 - <<'PY'
          import re, json, sys, io
          h = io.open('dom.html', encoding='utf-8').read()
          m = re.search(r'<div id="__probe__">(.*?)</div>', h, re.S)
          if not m:
              sys.exit("FALHA: a pagina nao terminou de renderizar")
          d = json.loads(m.group(1))
          print("ERROS JS:", d["errors"] or "NENHUM")
          for p, v in d["pages"].items():
              print(f"--- {p} ---")
              print("  funil :", v["steps"])
              if v["kpis"]: print("  kpis  :", v["kpis"])
              print("  tabelas:", v["tables"])
          print("graficos:", d["charts"])
          if d["errors"]:
              sys.exit("FALHA: erros de JS na pagina publicada")
          for p, v in d["pages"].items():
              if not v["steps"]: sys.exit(f"FALHA: funil vazio na pagina {p}")
              if not v["tables"]: sys.exit(f"FALHA: nenhuma tabela renderizada em {p}")
          print("OK: 3 paginas renderizam com dados reais, sem erro de JS")
          PY
