name: (temp) Probe planilhas

on:
  push:
    branches: [ claude/nice-hawking-gz7ryp ]
    paths:
      - ".github/workflows/_probe-planilhas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe (somente leitura; imprime cabecalhos, sem PII)
        run: |
          python3 - <<'PY'
          import csv, io, json, re, urllib.request

          SHEETS = {
            "META":   ("1KEmIpxN6fS-ovuLipmQTzGldKAIYAUznJStGeSSV7rM", "Página 1"),
            "VENDAS": ("1Qe1_LFcrd98hhOTa5rJAL78ZRUoHCZ-Pj4kIRgdiljI", "Cafe da Manha Lucrativo"),
          }
          PII = ("nome","name","email","e-mail","telefone","phone","cpf","endereco","endereço","address","zip","cep","documento")

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"probe/1.0"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode("utf-8", errors="replace")

          def tabs(sid):
              html = get(f"https://docs.google.com/spreadsheets/d/{sid}/htmlview")
              out = []
              for m in re.finditer(r'\{"[^{}]*?"name":"(.*?)"[^{}]*?\}', html):
                  pass
              # mapeamento robusto: procura pares nome/gid no bootstrap
              for m in re.finditer(r'"name":"((?:[^"\\]|\\.)*)"[^{}]{0,400}?"gid":"?(\d+)"?', html):
                  name = m.group(1).encode().decode("unicode_escape")
                  out.append((name, m.group(2)))
              # fallback: links de menu
              for m in re.finditer(r'id="sheet-button-(\d+)"[^>]*>([^<]+)<', html):
                  out.append((m.group(2), m.group(1)))
              seen, uniq = set(), []
              for n,g in out:
                  if (n,g) in seen: continue
                  seen.add((n,g)); uniq.append((n,g))
              return uniq

          def rows(sid, gid):
              raw = get(f"https://docs.google.com/spreadsheets/d/{sid}/export?format=csv&gid={gid}")
              return list(csv.reader(io.StringIO(raw)))

          for label,(sid,want) in SHEETS.items():
              print("="*78); print(f"### {label}  spreadsheet={sid}  aba alvo={want!r}")
              t = tabs(sid)
              print(f"-- abas encontradas ({len(t)}):")
              for n,g in t: print(f"   name={n!r}  gid={g}")
              gid = None
              for n,g in t:
                  if n.strip().lower() == want.strip().lower(): gid = g; break
              if gid is None:
                  for n,g in t:
                      if want.strip().lower()[:10] in n.strip().lower(): gid = g; break
              print(f"-- gid escolhido: {gid}")
              if gid is None: continue
              rs = rows(sid, gid)
              print(f"-- linhas totais (inclui cabecalho): {len(rs)}")
              hdr = rs[0] if rs else []
              print(f"-- COLUNAS ({len(hdr)}):")
              body = [r for r in rs[1:] if any((c or '').strip() for c in r)]
              print(f"-- linhas de dados nao-vazias: {len(body)}")
              for i,h in enumerate(hdr):
                  low = (h or "").lower()
                  masked = any(p in low for p in PII)
                  samples = []
                  for r in body[:400]:
                      v = (r[i] if i < len(r) else "").strip()
                      if v:
                          samples.append("<REDACTED len=%d>" % len(v) if masked else v)
                      if len(samples) >= 3: break
                  print(f"   [{i:>2}] {h!r}  ex: {samples}")
              # distintos uteis (nao-PII)
              for target in ("campaign name","ad set name","ad name","produto","oferta","metodo de pagamento","método de pagamento","status"):
                  for i,h in enumerate(hdr):
                      if (h or "").strip().lower() == target:
                          vals = sorted({(r[i] if i < len(r) else "").strip() for r in body if (r[i] if i < len(r) else "").strip()})
                          print(f"-- distintos de {h!r}: {len(vals)}")
                          for v in vals[:80]: print(f"     * {v}")
                          if len(vals) > 80: print(f"     ... (+{len(vals)-80})")
          PY
