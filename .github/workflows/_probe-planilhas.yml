name: (temp) Probe planilhas

on:
  push:
    branches: [ claude/nice-hawking-gz7ryp ]
    paths:
      - ".github/workflows/_probe-planilhas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe v3 (gids + validacao de atribuicao por UTM)
        run: |
          python3 - <<'PY'
          import csv, io, re, urllib.parse, urllib.request
          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/128.0.0.0 Safari/537.36")
          META_ID = "1KEmIpxN6fS-ovuLipmQTzGldKAIYAUznJStGeSSV7rM"
          SALE_ID = "1Qe1_LFcrd98hhOTa5rJAL78ZRUoHCZ-Pj4kIRgdiljI"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode("utf-8", errors="replace")

          def find_gids(sid, want):
              html = get(f"https://docs.google.com/spreadsheets/d/{sid}/edit")
              print(f"  html len={len(html)}")
              hits = [m.start() for m in re.finditer(re.escape(want), html)]
              print(f"  ocorrencias do nome da aba {want!r}: {len(hits)}")
              for h in hits[:4]:
                  ctx = html[max(0,h-260):h+260].replace("\n"," ")
                  print(f"  ...ctx: {ctx}")
              gids = sorted({m.group(1) for m in re.finditer(r'gid=(\d+)', html)})
              print(f"  gids vistos em 'gid=': {gids[:30]}")
              gids2 = sorted({m.group(1) for m in re.finditer(r'"(?:gid|sheetId)":"?(\d{1,12})"?', html)})
              print(f"  gids vistos em json: {gids2[:30]}")
              return sorted(set(gids) | set(gids2))

          def rows_gid(sid, gid):
              raw = get(f"https://docs.google.com/spreadsheets/d/{sid}/export?format=csv&gid={gid}")
              return list(csv.reader(io.StringIO(raw)))

          def rows_name(sid, name):
              raw = get(f"https://docs.google.com/spreadsheets/d/{sid}/gviz/tq?tqx=out:csv&sheet={urllib.parse.quote(name)}")
              return list(csv.reader(io.StringIO(raw)))

          for label, sid, want in (("META", META_ID, "Página 1"), ("VENDAS", SALE_ID, "Cafe da Manha Lucrativo")):
              print("="*78); print(f"### {label}")
              gids = find_gids(sid, want)
              ref = rows_name(sid, want)
              print(f"  gviz({want!r}): {len(ref)} linhas, header={ref[0][:4] if ref else None}")
              for g in gids[:12]:
                  try:
                      rs = rows_gid(sid, g)
                      same = (rs and ref and rs[0][:6] == ref[0][:6] and len(rs) == len(ref))
                      print(f"  gid={g}: {len(rs)} linhas header={rs[0][:4]}  MATCH={same}")
                  except Exception as e:
                      print(f"  gid={g}: ERRO {e!r}")

          print("="*78); print("### VALIDACAO DE ATRIBUICAO (UTM x Meta)")
          M = rows_name(META_ID, "Página 1"); S = rows_name(SALE_ID, "Cafe da Manha Lucrativo")
          mh, sh = M[0], S[0]
          mi = {h.strip().lower(): i for i, h in enumerate(mh)}
          si = {h.strip().lower(): i for i, h in enumerate(sh)}
          def dec(v):
              try: return urllib.parse.unquote(v)
              except Exception: return v
          camps = {r[mi["campaign name"]].strip() for r in M[1:] if any(r)}
          adsets = {r[mi["ad set name"]].strip() for r in M[1:] if any(r)}
          ads = {r[mi["ad name"]].strip() for r in M[1:] if any(r)}
          days = sorted({r[mi["day"]].strip() for r in M[1:] if any(r) and r[mi["day"]].strip()})
          print(f"META dias: {days[0]} -> {days[-1]}  ({len(days)} dias)")
          tot = sum(float(r[mi['amount spent']].replace('.','').replace(',','.') or 0) for r in M[1:] if any(r))
          imp = sum(float(r[mi['impressions']].replace('.','').replace(',','.') or 0) for r in M[1:] if any(r))
          clk = sum(float(r[mi['link clicks']].replace('.','').replace(',','.') or 0) for r in M[1:] if any(r))
          lpv = sum(float(r[mi['landing page views']].replace('.','').replace(',','.') or 0) for r in M[1:] if any(r))
          print(f"META totais: gasto={tot:.2f} impressoes={imp:.0f} cliques={clk:.0f} lpviews={lpv:.0f}")
          ok = {"camp":0,"adset":0,"ad":0}; n=0; fat=0.0
          sdays=[]
          for r in S[1:]:
              if not any((c or '').strip() for c in r): continue
              n += 1
              fat += float((r[si["valor da compra"]] or "0").replace(".","").replace(",","."))
              sdays.append(r[si["data"]].strip())
              c = r[si["utm_campaign"]].strip(); a = r[si["utm_medium"]].strip(); d = dec(r[si["utm_content"]].strip())
              if c in camps: ok["camp"] += 1
              if a in adsets: ok["adset"] += 1
              if d in ads: ok["ad"] += 1
              flag = "" if (c in camps and a in adsets and d in ads) else "   <<< NAO BATE"
              print(f"   venda: src={r[si['utm_source']]!r} camp_ok={c in camps} adset_ok={a in adsets} ad_ok={d in ads} ad={d!r}{flag}")
          print(f"VENDAS: n={n} faturamento={fat:.2f} datas={sorted(sdays)[0]} -> {sorted(sdays)[-1]}")
          print(f"casamento: campanha {ok['camp']}/{n} · conjunto {ok['adset']}/{n} · anuncio {ok['ad']}/{n}")
          PY
